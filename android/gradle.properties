org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Run the Kotlin compiler inside the Gradle daemon instead of a separate
# kotlin daemon. The standalone daemon writes its client marker to the user's
# home (~/.local/share/kotlin/daemon/), which is read-only in the build sandbox
# and fails with "Read-only file system"; in-process compilation needs no such
# write and keeps the unit-test build hermetic.
kotlin.compiler.execution.strategy=in-process
